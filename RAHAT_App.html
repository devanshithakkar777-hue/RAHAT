<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAHAT — Intelligent Relief Platform</title>
<style>
  :root {
    --navy: #0B3D5C;
    --navy-deep: #082A40;
    --navy-light: #EAF1F5;
    --teal: #01A7C2;
    --teal-light: #E3F7FA;
    --orange: #FF6B35;
    --orange-light: #FFEEE6;
    --ink: #14202B;
    --muted: #5B6B76;
    --faint: #8B98A1;
    --bg: #F5F8F9;
    --card: #FFFFFF;
    --border: #E1E8EB;
    --success: #1F9D63;
    --success-light: #E7F7EF;
    --danger: #E24B4A;
    --danger-light: #FDECEC;
    --radius: 12px;
    --shadow: 0 1px 3px rgba(11,61,92,0.08), 0 1px 2px rgba(11,61,92,0.06);
    --shadow-md: 0 8px 24px rgba(11,61,92,0.12);
  }
  [data-theme="dark"] {
    --navy: #0E4A6E;
    --navy-deep: #082A40;
    --navy-light: #12293A;
    --teal: #2BC4DE;
    --teal-light: #0E313A;
    --orange: #FF7D4D;
    --orange-light: #3A2417;
    --ink: #E8EEF2;
    --muted: #A7B7C2;
    --faint: #71828C;
    --bg: #0B1620;
    --card: #121F2B;
    --border: #223342;
    --success: #34C787;
    --success-light: #10301F;
    --danger: #F0716F;
    --danger-light: #3A1616;
    --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.24);
    --shadow-md: 0 8px 28px rgba(0,0,0,0.45);
  }
  [data-theme="dark"] body { background: var(--bg); }
  [data-theme="dark"] .hero { background: linear-gradient(135deg, #0E2B3F 0%, #081821 100%); }
  [data-theme="dark"] input, [data-theme="dark"] select { background: #0E1922 !important; color: var(--ink); }
  [data-theme="dark"] .progress-track { background: #1C2C38; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .serif { font-family: Cambria, Georgia, "Times New Roman", serif; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }
  ::selection { background: var(--teal); color: white; }

  /* ---------- Layout shell ---------- */
  #app { min-height: 100vh; display: flex; flex-direction: column; }

  .topbar {
    background: var(--navy);
    color: white;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
    position: sticky;
    top: 0;
    z-index: 50;
    box-shadow: var(--shadow);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; }
  .brand svg { width: 26px; height: 26px; flex-shrink: 0; }
  .brand .tag { font-size: 11px; font-weight: 400; color: #B9D3E3; margin-left: 8px; border-left: 1px solid #2E5A75; padding-left: 8px; }
  @media (max-width: 1360px) { .brand .tag { display: none; } }
  @media (max-width: 1180px) { .nav-tabs button { padding: 9px 9px; font-size: 12.5px; } }
  .nav { display: flex; gap: 4px; align-items: center; }
  .nav-tabs { display: flex; gap: 4px; align-items: center; overflow-x: auto; scrollbar-width: none; }
  .nav-tabs::-webkit-scrollbar { display: none; }
  .nav-icons { display: flex; gap: 4px; align-items: center; flex-shrink: 0; }
  .nav button, .nav-tabs button {
    background: transparent; border: none; color: #C9DCE8; padding: 9px 14px;
    border-radius: 8px; font-size: 13.5px; font-weight: 600; transition: all .15s; white-space: nowrap;
  }
  .nav button:hover, .nav-tabs button:hover { background: rgba(255,255,255,0.08); color: white; }
  .nav button.active, .nav-tabs button.active { background: var(--teal); color: white; }
  .nav .divider, .nav-icons .divider { width: 1px; height: 22px; background: #2E5A75; margin: 0 6px; }

  main { flex: 1; max-width: 1180px; margin: 0 auto; padding: 32px 24px 80px; width: 100%; }

  /* ---------- Common bits ---------- */
  .eyebrow {
    display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase; padding: 5px 12px; border-radius: 20px;
  }
  .eyebrow.navy { background: var(--navy-light); color: var(--navy); }
  .eyebrow.teal { background: var(--teal-light); color: #076779; }
  .eyebrow.orange { background: var(--orange-light); color: #B84F22; }
  .eyebrow.success { background: var(--success-light); color: var(--success); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 10px 18px; border-radius: 9px; font-size: 14px; font-weight: 600;
    border: none; transition: all .15s;
  }
  .btn-primary { background: var(--orange); color: white; }
  .btn-primary:hover { background: #E85A24; }
  .btn-secondary { background: var(--navy); color: white; }
  .btn-secondary:hover { background: var(--navy-deep); }
  .btn-outline { background: white; color: var(--navy); border: 1.5px solid var(--border); }
  .btn-outline:hover { border-color: var(--navy); }
  .btn-teal { background: var(--teal); color: white; }
  .btn-teal:hover { background: #018BA3; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-sm { padding: 6px 12px; font-size: 12.5px; }
  .btn-block { width: 100%; }

  .card {
    background: var(--card); border-radius: var(--radius); border: 1px solid var(--border);
    box-shadow: var(--shadow);
  }

  .progress-track { height: 8px; border-radius: 20px; background: #E9EEF1; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 20px; background: var(--teal); transition: width .4s ease; }
  .progress-fill.full { background: var(--success); }
  .progress-fill.low { background: var(--orange); }

  .badge-verified {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700;
    color: var(--success); background: var(--success-light); padding: 4px 10px; border-radius: 20px;
  }

  /* ---------- Hero ---------- */
  .hero {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-deep) 100%);
    border-radius: 18px; color: white; padding: 40px 44px; margin-bottom: 32px;
    position: relative; overflow: hidden;
  }
  .hero::after {
    content: ""; position: absolute; right: -60px; top: -80px; width: 260px; height: 260px;
    border-radius: 50%; background: radial-gradient(circle, rgba(1,167,194,0.28), transparent 70%);
  }
  .hero h1 { font-size: 30px; margin: 10px 0 8px; font-weight: 700; max-width: 620px; position: relative; }
  .hero p { color: #C9DCE8; max-width: 560px; font-size: 14.5px; margin: 0 0 20px; position: relative; }
  .hero-stats { display: flex; gap: 32px; position: relative; flex-wrap: wrap; }
  .hero-stats div strong { display: block; font-size: 24px; font-weight: 700; color: var(--teal); }
  .hero-stats div span { font-size: 12px; color: #A9C4D6; }

  /* ---------- Disaster cards ---------- */
  .section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 36px 0 16px; }
  .section-head h2 { font-size: 20px; margin: 0; }
  .section-head .sub { color: var(--muted); font-size: 13px; }

  .disaster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; }
  .disaster-card { padding: 20px; display: flex; flex-direction: column; gap: 12px; cursor: pointer; transition: transform .15s, box-shadow .15s; }
  .disaster-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .disaster-card .top-row { display: flex; align-items: center; justify-content: space-between; }
  .disaster-card h3 { font-size: 17px; margin: 6px 0 2px; }
  .disaster-card .loc { color: var(--muted); font-size: 13px; margin-bottom: 4px; }
  .disaster-card .meta-row { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); }
  .disaster-card .meta-row strong { color: var(--ink); }

  /* ---------- Detail page ---------- */
  .detail-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; flex-wrap: wrap; margin-bottom: 8px; }
  .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; font-weight: 600; margin-bottom: 16px; }
  .back-link:hover { color: var(--navy); }
  .stat-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 22px 0; }
  .stat-box { padding: 16px 18px; }
  .stat-box .num { font-size: 22px; font-weight: 700; color: var(--navy); }
  .stat-box .lbl { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .need-list { display: flex; flex-direction: column; gap: 14px; }
  .need-card { padding: 18px 20px; }
  .need-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
  .need-top h4 { margin: 0 0 3px; font-size: 15.5px; }
  .need-top .unit-info { font-size: 12.5px; color: var(--muted); }
  .need-numbers { text-align: right; font-size: 13px; white-space: nowrap; }
  .need-numbers strong { color: var(--navy); font-size: 14.5px; }
  .flag-full { font-size: 11.5px; font-weight: 700; color: var(--success); background: var(--success-light); padding: 3px 9px; border-radius: 20px; display: inline-block; margin-top: 6px; }
  .flag-low { font-size: 11.5px; font-weight: 700; color: #B84F22; background: var(--orange-light); padding: 3px 9px; border-radius: 20px; display: inline-block; margin-top: 6px; }

  .trail { margin-top: 10px; border-left: 2px solid var(--border); padding-left: 16px; display: flex; flex-direction: column; gap: 14px; }
  .trail-item { position: relative; font-size: 13px; }
  .trail-item::before { content: ""; position: absolute; left: -21px; top: 4px; width: 9px; height: 9px; border-radius: 50%; background: var(--teal); border: 2px solid white; box-shadow: 0 0 0 1.5px var(--teal); }
  .trail-item .t-date { color: var(--faint); font-size: 11.5px; }
  .trail-item .t-body { color: var(--ink); }
  .trail-item .t-tag { display: inline-block; margin-top: 3px; font-size: 11px; color: var(--navy); background: var(--navy-light); padding: 2px 8px; border-radius: 10px; }

  .side-col { display: flex; flex-direction: column; gap: 18px; }
  .info-row { display: flex; justify-content: space-between; font-size: 13px; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .info-row:last-child { border-bottom: none; }
  .info-row span:first-child { color: var(--muted); }
  .info-row span:last-child { font-weight: 600; text-align: right; }

  .detail-grid { display: grid; grid-template-columns: 1.7fr 1fr; gap: 26px; align-items: start; }
  @media (max-width: 900px) { .detail-grid { grid-template-columns: 1fr; } .stat-strip { grid-template-columns: repeat(2,1fr); } }

  /* ---------- Modal ---------- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(8,25,35,0.55); display: flex; align-items: center;
    justify-content: center; z-index: 200; padding: 20px; backdrop-filter: blur(2px);
  }
  .modal {
    background: white; border-radius: 16px; width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .modal-head { padding: 20px 24px 0; display: flex; justify-content: space-between; align-items: center; }
  .modal-head h3 { margin: 0; font-size: 17px; }
  .modal-close { background: none; border: none; font-size: 20px; color: var(--muted); line-height: 1; padding: 4px; }
  .modal-body { padding: 16px 24px 24px; }
  .step-dots { display: flex; gap: 6px; padding: 0 24px; margin-top: 10px; }
  .step-dots span { height: 4px; flex: 1; border-radius: 4px; background: var(--border); }
  .step-dots span.done { background: var(--teal); }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12.5px; font-weight: 700; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .03em; }
  .field input, .field select {
    width: 100%; padding: 11px 13px; border-radius: 9px; border: 1.5px solid var(--border);
    font-size: 14px; font-family: inherit; background: #FBFCFD;
  }
  .field input:focus, .field select:focus { outline: none; border-color: var(--teal); background: white; }
  .chip-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .chip { padding: 8px 14px; border-radius: 8px; border: 1.5px solid var(--border); background: white; font-size: 13.5px; font-weight: 600; color: var(--navy); }
  .chip.selected { border-color: var(--teal); background: var(--teal-light); color: #076779; }

  .need-option { display: flex; align-items: center; justify-content: space-between; padding: 11px 13px; border: 1.5px solid var(--border); border-radius: 9px; margin-bottom: 8px; font-size: 13.5px; }
  .need-option.selected { border-color: var(--teal); background: var(--teal-light); }
  .need-option input[type=radio] { margin-right: 8px; }

  .notice {
    font-size: 12.5px; padding: 10px 13px; border-radius: 9px; margin-bottom: 14px; line-height: 1.45;
  }
  .notice.warn { background: var(--orange-light); color: #A64920; }
  .notice.info { background: var(--teal-light); color: #076779; }

  .receipt { text-align: center; padding: 8px 0 4px; }
  .receipt .checkmark {
    width: 56px; height: 56px; border-radius: 50%; background: var(--success-light); color: var(--success);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; font-size: 28px;
  }
  .receipt-table { text-align: left; background: #FBFCFD; border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-top: 16px; font-size: 13px; }
  .receipt-table div { display: flex; justify-content: space-between; padding: 5px 0; }
  .receipt-table div span:first-child { color: var(--muted); }
  .receipt-table div span:last-child { font-weight: 700; }

  /* ---------- Transparency dashboard ---------- */
  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
  .kpi-box { padding: 20px; }
  .kpi-box .num { font-size: 26px; font-weight: 700; color: var(--navy); }
  .kpi-box .lbl { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .kpi-box .delta { font-size: 11.5px; color: var(--success); margin-top: 4px; font-weight: 600; }

  .bar-row { display: grid; grid-template-columns: 190px 1fr 90px; align-items: center; gap: 12px; padding: 9px 0; font-size: 13px; }
  .bar-row .name { font-weight: 600; }
  .bar-row .pct { text-align: right; color: var(--muted); font-size: 12.5px; }

  .activity-item { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .activity-item:last-child { border-bottom: none; }
  .activity-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); margin-top: 6px; flex-shrink: 0; }
  .activity-item .a-meta { color: var(--faint); font-size: 11.5px; }

  .table-simple { width: 100%; border-collapse: collapse; font-size: 13px; }
  .table-simple th { text-align: left; color: var(--muted); font-weight: 700; font-size: 11.5px; text-transform: uppercase; letter-spacing: .03em; padding: 8px 10px; border-bottom: 2px solid var(--border); }
  .table-simple td { padding: 10px 10px; border-bottom: 1px solid var(--border); }
  .table-simple tr:last-child td { border-bottom: none; }

  /* ---------- Admin ---------- */
  .admin-login { max-width: 420px; margin: 60px auto; padding: 32px; text-align: center; }
  .admin-login .icon-circle { width: 54px; height: 54px; border-radius: 50%; background: var(--navy-light); color: var(--navy); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; font-size: 24px; }
  .admin-need-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid var(--border); gap: 16px; flex-wrap: wrap; }
  .admin-need-row:last-child { border-bottom: none; }
  .stepper { display: flex; align-items: center; gap: 8px; }
  .stepper button { width: 30px; height: 30px; border-radius: 8px; border: 1.5px solid var(--border); background: white; font-size: 15px; font-weight: 700; color: var(--navy); }
  .stepper button:hover { border-color: var(--teal); }
  .stepper .val { min-width: 60px; text-align: center; font-weight: 700; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--navy); color: white;
    padding: 12px 22px; border-radius: 10px; font-size: 13.5px; font-weight: 600; box-shadow: var(--shadow-md);
    z-index: 300; display: flex; align-items: center; gap: 8px; animation: toastIn .25s ease;
  }
  @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }

  .footer-note { text-align: center; color: var(--faint); font-size: 12px; margin-top: 50px; padding-top: 20px; border-top: 1px solid var(--border); }

  /* ---------- Theme toggle + notification bell ---------- */
  .icon-btn {
    background: rgba(255,255,255,0.08); border: none; color: #C9DCE8; width: 36px; height: 36px;
    border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 15px; position: relative;
  }
  .icon-btn:hover { background: rgba(255,255,255,0.16); color: white; }
  .bell-badge {
    position: absolute; top: -3px; right: -3px; background: var(--orange); color: white; font-size: 10px;
    font-weight: 700; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  }
  .notif-panel {
    position: absolute; top: 56px; right: 24px; width: 340px; max-height: 420px; overflow-y: auto;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-md); z-index: 100;
    color: var(--ink);
  }
  .notif-head { padding: 14px 16px; border-bottom: 1px solid var(--border); font-weight: 700; font-size: 13.5px; display:flex; justify-content:space-between; align-items:center; color: var(--ink); }
  .notif-item { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 12.5px; display: flex; gap: 9px; color: var(--ink); }
  .notif-item .modal-close, .notif-head .modal-close { color: var(--muted); }
  .notif-item:last-child { border-bottom: none; }
  .notif-item.unread { background: var(--teal-light); }
  .notif-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--teal); margin-top: 4px; flex-shrink: 0; }
  .notif-item .n-time { color: var(--faint); font-size: 11px; margin-top: 2px; }
  .notif-empty { padding: 30px 16px; text-align: center; color: var(--muted); font-size: 12.5px; }

  /* ---------- Search & filter bar ---------- */
  .filter-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
  .filter-bar input[type=text] {
    flex: 1; min-width: 200px; padding: 10px 14px; border-radius: 9px; border: 1.5px solid var(--border);
    font-size: 13.5px; background: var(--card); color: var(--ink); font-family: inherit;
  }
  .filter-bar input[type=text]:focus { outline: none; border-color: var(--teal); }
  .filter-bar select {
    padding: 10px 12px; border-radius: 9px; border: 1.5px solid var(--border); font-size: 13px;
    background: var(--card); color: var(--ink); font-family: inherit;
  }
  .filter-chip-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .filter-chip {
    padding: 7px 13px; border-radius: 20px; border: 1.5px solid var(--border); background: var(--card);
    color: var(--muted); font-size: 12.5px; font-weight: 600;
  }
  .filter-chip.active { background: var(--navy); border-color: var(--navy); color: white; }
  .no-results { text-align: center; padding: 50px 20px; color: var(--muted); }

  /* ---------- District drill-down ---------- */
  .district-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap: 10px; margin-top: 10px; }
  .district-tile {
    border: 1.5px solid var(--border); border-radius: 10px; padding: 12px 14px; cursor: pointer; transition: border-color .15s;
  }
  .district-tile:hover { border-color: var(--teal); }
  .district-tile.expanded { border-color: var(--teal); background: var(--teal-light); grid-column: 1 / -1; cursor: default; }
  .district-tile h5 { margin: 0 0 4px; font-size: 13.5px; }
  .district-tile .d-stat { font-size: 11.5px; color: var(--muted); }
  .district-detail-row { display: flex; gap: 22px; margin-top: 10px; flex-wrap: wrap; font-size: 12.5px; }
  .district-detail-row div strong { display: block; font-size: 16px; color: var(--navy); }

  /* ---------- Leaderboard ---------- */
  .leader-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .leader-row:last-child { border-bottom: none; }
  .leader-rank { width: 24px; text-align: center; font-weight: 700; color: var(--faint); font-size: 13px; }
  .leader-rank.top1 { color: #C9962A; }
  .leader-rank.top2 { color: #8B96A1; }
  .leader-rank.top3 { color: #B0703A; }
  .leader-name { flex: 1; font-size: 13px; font-weight: 600; }
  .leader-amt { font-size: 13px; font-weight: 700; color: var(--navy); }
  .tier-badge { font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 10px; margin-left: 8px; }
  .tier-badge.gold { background: #FBEBC7; color: #8A5E0B; }

function simpleHash(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) { h = (h * 31 + str.charCodeAt(i)) >>> 0; }
  return h.toString(16).padStart(8, '0');
}

   AI LAYER — attempts a live Claude API call (works when this page is
   rendered inside a Claude.ai artifact); falls back to a deterministic,
   data-grounded local "smart assistant" everywhere else (e.g. when this

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, ch => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[ch]));
}

function buildDataContext() {
  return Object.values(DISASTERS).map(d => {
    const cash = d.needs.filter(n=>n.type==='cash');
    const overallPct = cash.length ? pct(cash.reduce((s,n)=>s+n.raised,0), cash.reduce((s,n)=>s+n.target,0))
      : Math.round(d.needs.reduce((s,n)=>s+needProgress(n).p,0)/Math.max(1,d.needs.length));
    return {
      name: d.name, location: d.location, severity: d.severity, verifiedBy: d.verifiedBy,
      peopleAffected: d.peopleAffected, overallFundedPct: overallPct,
      needs: d.needs.map(n => ({ category: n.category, type: n.type, pctFunded: needProgress(n).p, unit: n.unit }))
    };
  });
}

async function callAI(systemPrompt, userPrompt) {
  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        system: systemPrompt,
        messages: [{ role: 'user', content: userPrompt }]
      })
    });
    if (!response.ok) throw new Error('non-200');
    const data = await response.json();
    const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n').trim();
    if (!text) throw new Error('empty response');
    return text;
  } catch (e) {
    return null;
  }
}

function mostUrgentNeed(disasterFilter) {
  let best = null;
  Object.values(DISASTERS).forEach(d => {
    if (disasterFilter && !disasterFilter(d)) return;
    d.needs.forEach(n => {
      const { p } = needProgress(n);
      if (!best || p < best.p) best = { d, n, p };
    });
  });
  return best;
}

function findPossibleDuplicate(category, disasterId) {
  const d = DISASTERS[disasterId];
  if (!d) return null;
  const words = category.toLowerCase().split(/\W+/).filter(w => w.length > 3);
  let match = null;
  d.needs.forEach(n => {
    const nWords = n.category.toLowerCase().split(/\W+/);
    if (words.some(w => nWords.includes(w))) match = n;
  });
  return match;
}

// Deterministic, data-grounded fallback used whenever the live API is unreachable
// (e.g. this file opened directly rather than inside a Claude.ai artifact).
function localAssistantReply(userText) {
  const q = userText.toLowerCase();
  const disasters = Object.values(DISASTERS);

  const named = disasters.find(d => q.includes(d.name.toLowerCase().split(' ')[0].toLowerCase()));
  if (named) {
    const cash = named.needs.filter(n=>n.type==='cash');
    const overallPct = cash.length ? pct(cash.reduce((s,n)=>s+n.raised,0), cash.reduce((s,n)=>s+n.target,0)) : 0;
    const urgent = mostUrgentNeed(d => d.id === named.id);
    return `${named.name} (${named.location}) is verified by ${named.verifiedBy}. ${num(named.peopleAffected)} people are affected and cash relief is ${overallPct}% funded. The most underfunded item right now is ${urgent.n.category} at ${urgent.p}%. `
      + `<button class="ai-inline-link" onclick="jumpToNeed('${named.id}','${urgent.n.id}')">Take me there →</button>`;
  }

  const categoryKeywords = [
    { words: ['water','drink','purif'], label: 'water' },
    { words: ['shelter','tent','housing'], label: 'shelter' },
    { words: ['medic','health','doctor','medicine'], label: 'medical' },
    { words: ['food','ration','hungry'], label: 'food' },
    { words: ['boat','rescue'], label: 'rescue' },
    { words: ['child','baby','infant'], label: 'baby' },
  ];
  const matchedCat = categoryKeywords.find(c => c.words.some(w => q.includes(w)));
  if (matchedCat) {
    const hit = mostUrgentNeed(d => d.needs.some(n => n.category.toLowerCase().includes(matchedCat.label) || matchedCat.words.some(w=>n.category.toLowerCase().includes(w))));
    if (hit) {
      return `For ${matchedCat.label}-related needs, the biggest gap I can find is ${hit.n.category} under ${hit.d.name} — only ${hit.p}% funded. `
        + `<button class="ai-inline-link" onclick="jumpToNeed('${hit.d.id}','${hit.n.id}')">Contribute here →</button>`;
    }
  }

  if (q.includes('where') || q.includes('urgent') || q.includes('most') || q.includes('help')) {
    const hit = mostUrgentNeed();
    return `Right now the most urgent gap across every verified operation is ${hit.n.category} for ${hit.d.name} — just ${hit.p}% funded (${hit.d.location}). `
      + `<button class="ai-inline-link" onclick="jumpToNeed('${hit.d.id}','${hit.n.id}')">Take me there →</button>`;
  }

  if (q.includes('volunteer')) {
    return `You can volunteer directly from any disaster's page — look for the "Volunteer for this operation" button. Skills currently most requested include medical support and logistics. `
      + `<button class="ai-inline-link" onclick="goTo('home')">Browse disasters →</button>`;
  }

  if (q.includes('trust') || q.includes('verif') || q.includes('real') || q.includes('fraud')) {
    return `Every disaster on RAHAT is sourced only from official DDMA/SDMA/NDMA feeds — never a self-submitted appeal. Every allocation is logged to a public, tamper-evident ledger you can inspect on each disaster's page.`;
  }

  const hit = mostUrgentNeed();
  return `I can help you find where your contribution matters most. For example, right now ${hit.n.category} for ${hit.d.name} is only ${hit.p}% funded. Try asking me things like "where should I donate" or the name of a specific disaster.`;
}

/* =====================================================================
   RENDER HELPERS
   ===================================================================== */

function categoryOf(need) {
  const c = need.category.toLowerCase();
  if (c.includes('food') || c.includes('ration')) return 'Food';
  if (c.includes('medical') || c.includes('health')) return 'Medical';
  if (c.includes('shelter') || c.includes('tent') || c.includes('housing')) return 'Shelter';
  if (c.includes('water') || c.includes('purif')) return 'Water';
  return 'Other';
}

function needProgress(need) {
  const current = need.type === 'cash' ? need.raised : need.received;
  const target = need.target;
  return { current, target, p: pct(current, target) };
}

// Required / Received (delivered) / In Transit / Remaining framework used across
// the RAHAT dashboards. "pledged" is the total ever contributed by donors (what
// needProgress calls "current"); "delivered" is the subset field officers have
// confirmed as physically distributed; the gap between the two is "in transit".
function needStats(need) {
  const pledged = need.type === 'cash' ? need.raised : need.received;
  const delivered = Math.min(need.delivered || 0, pledged);
  const inTransit = Math.max(0, pledged - delivered);
  const remaining = Math.max(0, need.target - pledged);
  return { target: need.target, pledged, delivered, inTransit, remaining };
}

function aggregateStats(disasters, typeFilter) {
  const agg = { target: 0, pledged: 0, delivered: 0, inTransit: 0, remaining: 0 };
  disasters.forEach(d => d.needs.forEach(n => {
    if (typeFilter && n.type !== typeFilter) return;
    const s = needStats(n);
    agg.target += s.target; agg.pledged += s.pledged; agg.delivered += s.delivered;
    agg.inTransit += s.inTransit; agg.remaining += s.remaining;
  }));
  return agg;
}

   PUBLIC FUNDS HELPERS
   ===================================================================== */

function fundsFor(disasterId) {
  return disasterId ? PUBLIC_FUNDS.filter(f => f.disasterId === disasterId) : PUBLIC_FUNDS;
}

function fundTotals(funds) {
  return {
    sanctioned: funds.reduce((s,f)=>s+f.amount,0),
    disbursed: funds.filter(f=>f.status==='Disbursed'||f.status==='Utilized').reduce((s,f)=>s+f.amount,0),
    utilized: funds.filter(f=>f.status==='Utilized').reduce((s,f)=>s+f.amount,0),
  };
}

function citizenTotalFor(disasterId) {
  // Aggregate pledged-by-citizens total (consistent with the "Total cash
  // contributed" figure elsewhere) — not the small CONTRIBUTIONS array,
  // which only logs this session's own donations.
  const list = disasterId ? [DISASTERS[disasterId]] : Object.values(DISASTERS);
  return list.reduce((s,d) => s + d.needs.filter(n=>n.type==='cash').reduce((a,n)=>a+n.raised,0), 0);
}

// Rule-based anomaly detection over the public fund ledger — deliberately
// simple, transparent thresholds rather than a black box, so officials and
// citizens can both see exactly why something was flagged.
function detectFundAnomalies() {
  const flags = [];
  PUBLIC_FUNDS.forEach(f => {
    const daysSince = Math.floor((now - f.date) / (1000*60*60*24));
    if (f.status === 'Sanctioned' && daysSince > 15) {
      flags.push({ fundId: f.id, disasterId: f.disasterId, severity: 'Medium', reason: `${f.source} funds of ${inr(f.amount)} were sanctioned ${daysSince} days ago but still show no disbursement.` });
    }
    if ((f.status === 'Disbursed' || f.status === 'Utilized') && f.ucStatus === 'Pending' && daysSince > 10) {
      flags.push({ fundId: f.id, disasterId: f.disasterId, severity: 'Low', reason: `Utilization certificate for ${inr(f.amount)} from ${f.source} is overdue (${daysSince} days since disbursement, no UC filed).` });
    }
  });
  GRIEVANCES.forEach(g => {
    if (g.status === 'Under Review') {
      flags.push({ fundId: g.fundId, disasterId: g.disasterId, severity: 'High', reason: `Open citizen grievance: ${g.description}` });
    }
  });
  return flags;
}

function disasterCard(d) {
  const cashNeeds = d.needs.filter(n=>n.type==='cash');
  const hasCash = cashNeeds.length > 0;
  const totalRaised = cashNeeds.reduce((s,n)=>s+n.raised,0);
  const totalTarget = cashNeeds.reduce((s,n)=>s+n.target,0);
  // Fallback to blended supply-fulfillment average when a disaster has no cash needs yet
  const supplyNeeds = d.needs.filter(n=>n.type==='supply');
  const avgSupplyPct = supplyNeeds.length ? Math.round(supplyNeeds.reduce((s,n)=>s+needProgress(n).p,0)/supplyNeeds.length) : 0;
  const p = hasCash ? pct(totalRaised, totalTarget) : avgSupplyPct;
  const progressLabel = hasCash
    ? `<span><strong>${inr(totalRaised)}</strong> raised of ${inr(totalTarget)}</span><span>${p}%</span>`
    : `<span>Avg. supply fulfillment</span><span>${p}%</span>`;
  return `
    <div class="card disaster-card" onclick="openDisaster('${d.id}')">
      <div class="top-row">
        <span class="badge-verified">&#10003; Verified · ${d.verifiedBy.split(' (')[1] ? d.verifiedBy.match(/\(([^)]+)\)/)[1] : d.verifiedBy}</span>
        <span class="eyebrow ${d.severity==='Severe'?'orange':'teal'}">${d.severity}</span>
      </div>
      <div>
        <h3>${d.name}</h3>
        <div class="loc">${d.location}</div>
      </div>
      <div>
        <div class="progress-track"><div class="progress-fill ${p>=100?'full':''}" style="width:${p}%"></div></div>
        <div class="meta-row" style="margin-top:6px;">
          ${progressLabel}
        </div>
      </div>
      <div class="meta-row">
        <span>${num(d.peopleAffected)} people affected</span>
        <span>${d.donorCount.toLocaleString('en-IN')} donors</span>
      </div>
    </div>
  `;
}

function renderReliefMap(d) {
  // Schematic (not geographically precise) river-and-district map, purely for
  // quick visual orientation — coordinates are illustrative, not surveyed.
  const positions = {
    'Dhemaji': [70, 45], 'Lakhimpur': [160, 65], 'Nagaon': [300, 110],
    'Morigaon': [370, 95], 'Barpeta': [230, 140], 'Dhubri': [80, 150],
  };
  const pins = d.districts.map(dist => {
    const [x,y] = positions[dist.name] || [300,100];
    const matchedNeed = d.needs.find(n => n.category.includes(dist.topNeed) || dist.topNeed.includes(n.category.split(' (')[0]));
    const urgent = needProgress(matchedNeed || d.needs[0]).p < 40;
    return `
      <g class="map-pin" onclick="toggleDistrict('${dist.name}')">
        <circle cx="${x}" cy="${y}" r="9" fill="${urgent ? 'var(--orange)' : 'var(--teal)'}" stroke="white" stroke-width="2"/>
        <text x="${x}" y="${y-14}" text-anchor="middle">${dist.name}</text>
      </g>`;
  }).join('');
  return `
    <div style="margin-bottom:10px;">
      <svg class="relief-map-svg" viewBox="0 0 440 190" xmlns="http://www.w3.org/2000/svg">
        <path d="M 20 160 Q 120 130 180 140 T 300 105 Q 350 95 410 60" fill="none" stroke="var(--teal-light)" stroke-width="14" stroke-linecap="round"/>
        <path d="M 20 160 Q 120 130 180 140 T 300 105 Q 350 95 410 60" fill="none" stroke="var(--teal)" stroke-width="2" stroke-dasharray="1 6" stroke-linecap="round" opacity="0.5"/>
        ${pins}
      </svg>
      <div style="font-size:10.5px; color:var(--faint); text-align:center; margin-top:-4px;">Schematic relief map along the Brahmaputra (not to scale) · orange = urgent need &lt;40% funded</div>
    </div>
  `;
}

function exportTransparencyCSV() {
  const rows = [['Disaster','Verified By','Need Category','Type','Current','Target','Unit','Percent Funded']];
  Object.values(DISASTERS).forEach(d => {
    d.needs.forEach(n => {
      const { current, target, p } = needProgress(n);
      rows.push([d.name, d.verifiedBy, n.category, n.type, current, target, n.unit, p + '%']);
    });
  });
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'sevatech_transparency_export.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('CSV exported');
}

    .slice().sort((a,b) => b.amount - a.amount);
  function tier(amount) {
    if (amount >= 50000) return { label: 'Gold', cls: 'gold' };
    if (amount >= 10000) return { label: 'Silver', cls: 'silver' };
    return { label: 'Bronze', cls: 'bronze' };

  return `
    <div class="card" style="padding: 20px 22px; margin-top:20px;">
      <h3 style="margin:0 0 4px; font-size:15px;">Top contributors this month</h3>
      <p style="font-size:12px; color:var(--muted); margin:0 0 10px;">Recognition tiers: Gold ≥ ₹50,000 · Silver ≥ ₹10,000 · Bronze below ₹10,000</p>
      ${rows.map((r, i) => {
        const t = tier(r.amount);
        const rankCls = i===0 ? 'top1' : i===1 ? 'top2' : i===2 ? 'top3' : '';
        return `

  `;
}

      <div class="card kpi-box"><div class="num">${fullyFundedCount}</div><div class="lbl">Needs fully funded</div></div>
      <div class="card kpi-box"><div class="num">${underfunded.length}</div><div class="lbl">Needs below 30% funded</div></div>

function renderPublicFunds() {
  const f = STATE.fundsFilter;
  const filtered = f === 'all' ? PUBLIC_FUNDS : PUBLIC_FUNDS.filter(x => x.disasterId === f);
  const totals = fundTotals(filtered);
  const citizenTotal = f === 'all' ? citizenTotalFor(null) : citizenTotalFor(f);
  const peopleAffected = f === 'all' ? Object.values(DISASTERS).reduce((s,d)=>s+d.peopleAffected,0) : DISASTERS[f].peopleAffected;
  const spendPerPerson = Math.round((totals.disbursed + citizenTotal) / Math.max(1, peopleAffected));
  const anomalies = detectFundAnomalies().filter(a => f === 'all' || a.disasterId === f);
  const sourceGroups = {};
  filtered.forEach(x => { const key = x.source.split('(')[0].split('—')[0].trim(); sourceGroups[key] = (sourceGroups[key]||0) + x.amount; });
  const sourceColors = ['#0B3D5C','#01A7C2','#FF6B35','#34C787','#8B98A1','#C9962A'];
  const donutSegs = Object.entries(sourceGroups).map(([label,value],i) => ({ label, value, color: sourceColors[i%sourceColors.length] }))
    .concat([{ label: 'Citizen contributions', value: citizenTotal, color: '#0E4A6E' }]);

  return `
    <div class="section-head" style="margin-top:0;">
      <div>
        <h2>Public Funds Transparency Ledger</h2>
        <span class="sub">Every government and CSR rupee released for relief — sanctioned, disbursed and utilized, in one place</span>
      </div>
      <select onchange="setFundsFilter(this.value)" style="padding:9px 12px; border-radius:9px; border:1.5px solid var(--border); font-size:13px;">
        <option value="all" ${f==='all'?'selected':''}>All disasters</option>
        ${Object.values(DISASTERS).map(d => `<option value="${d.id}" ${f===d.id?'selected':''}>${d.name}</option>`).join('')}
      </select>
    </div>

    <div class="kpi-grid">
      <div class="card kpi-box"><div class="num">${inr(totals.sanctioned)}</div><div class="lbl">Total sanctioned</div></div>
      <div class="card kpi-box"><div class="num" style="color:var(--teal);">${inr(totals.disbursed)}</div><div class="lbl">Disbursed to date</div></div>
      <div class="card kpi-box"><div class="num" style="color:var(--success);">${inr(totals.utilized)}</div><div class="lbl">Confirmed utilized</div></div>
      <div class="card kpi-box"><div class="num">₹${num(spendPerPerson)}</div><div class="lbl">Spend per person affected</div></div>
    </div>

    ${anomalies.length ? `
    <div class="section-head" style="margin-bottom:6px;"><h2 style="font-size:16px;">⚠ Anomaly & integrity flags (${anomalies.length})</h2></div>
    ${anomalies.map(a => `<div class="anomaly-card"><span class="a-sev ${a.severity}">${a.severity}</span>${escapeHtml(a.reason)}</div>`).join('')}
    ` : `<div class="notice info" style="max-width:none;">✓ No integrity flags for this selection — all fund entries pass basic timeliness and utilization-certificate checks.</div>`}

    <div class="grievance-btn-row">
      <button class="btn btn-outline btn-sm" onclick="openGrievance('${f==='all'?'assam-floods-2026':f}')">🚩 Report suspected misuse</button>
      <button class="btn btn-outline btn-sm" onclick="toggleOpenData()">📂 Open Data Explorer</button>
      <button class="btn btn-outline btn-sm" onclick="exportPublicFundsCSV()">⬇ Export ledger as CSV</button>
    </div>

    ${STATE.openDataVisible ? `
      <div class="opendata-box">${escapeHtml(JSON.stringify(filtered.map(x=>({id:x.id, source:x.source, amount:x.amount, status:x.status, ucStatus:x.ucStatus, hash:x.hash})), null, 2))}</div>
      <div class="footer-note" style="margin-top:8px; margin-bottom:8px;">This is the same structured data every table on this page renders from — RTI-ready by design.</div>
    ` : ''}

    <div class="detail-grid" style="margin: 20px 0;">
      <div class="card" style="padding:18px 20px;">
        <h3 style="margin:0 0 12px; font-size:14.5px;">Fund ledger (hash-chained, tamper-evident)</h3>
        ${filtered.length === 0 ? '<div class="no-results">No fund entries for this selection.</div>' : filtered.map(entry => renderFundBlock(entry)).join('')}

      <div class="side-col">
        <div class="card" style="padding:18px 20px;">
          <h3 style="margin:0 0 12px; font-size:14.5px;">Where the money comes from</h3>
          ${renderDonutChart(donutSegs)}
        </div>
        <div class="card" style="padding:18px 20px;">
          <h3 style="margin:0 0 4px; font-size:14.5px;">Why trust this ledger?</h3>
          <p style="font-size:12px; color:var(--muted); margin:0;">Each entry stores a hash of the previous entry plus its own details. Editing or deleting a past entry would break every hash after it — making silent tampering visible. (Illustrative hashing for this prototype, not production cryptography.)</p>
        </div>
      </div>
    </div>
    <div class="footer-note">All fund figures are illustrative mock data for the RAHAT SIH 2026 prototype (Team SevaTech).</div>

function renderDonutChart(segments, size) {
  size = size || 130;
  const r = size/2 - 8, cx = size/2, cy = size/2, circ = 2*Math.PI*r;
  const total = segments.reduce((s,x)=>s+x.value,0) || 1;
  let offset = 0;
  const arcs = segments.map(seg => {
    const frac = seg.value/total;
    const dash = frac*circ;
    const el = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="16" stroke-dasharray="${dash} ${circ-dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
    offset += dash;
    return el;
  }).join('');
  return `
    <div style="display:flex; align-items:center; gap:18px; flex-wrap:wrap;">
      <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${arcs}</svg>
      <div style="display:flex; flex-direction:column; gap:6px;">
        ${segments.map(seg => `
          <div style="display:flex; align-items:center; gap:7px; font-size:12px;">
            <span style="width:10px; height:10px; border-radius:3px; background:${seg.color}; display:inline-block;"></span>
            <span style="color:var(--ink);">${seg.label}</span>
            <span style="color:var(--faint);">${Math.round(seg.value/total*100)}%</span>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function renderLineChart(points, color, w, h) {
  w = w || 460; h = h || 140;
  const pad = 28;
  const max = Math.max(...points.map(p=>p.value), 1);
  const stepX = (w - pad*2) / (points.length - 1);
  const coords = points.map((p,i) => {
    const x = pad + i*stepX;
    const y = h - pad - (p.value/max)*(h - pad*1.6);
    return [x,y];
  });
  const path = coords.map((c,i) => (i===0?'M':'L') + c[0].toFixed(1) + ' ' + c[1].toFixed(1)).join(' ');
  const areaPath = path + ` L ${coords[coords.length-1][0].toFixed(1)} ${h-pad} L ${coords[0][0].toFixed(1)} ${h-pad} Z`;
  return `
    <svg width="100%" viewBox="0 0 ${w} ${h}" style="overflow:visible;">
      <path d="${areaPath}" fill="${color}" opacity="0.12"/>
      <path d="${path}" fill="none" stroke="${color}" stroke-width="2.5"/>
      ${coords.map((c,i) => `<circle cx="${c[0]}" cy="${c[1]}" r="3.5" fill="${color}"/>`).join('')}
      ${points.map((p,i) => `<text x="${coords[i][0]}" y="${h-6}" font-size="9" fill="var(--faint)" text-anchor="middle">${p.label}</text>`).join('')}
    </svg>
  `;
}

function renderGroupedBarChart(rows, w, h) {
  w = w || 560; h = h || 210;
  const pad = 30, bottomPad = 34;
  const max = Math.max(...rows.map(r => Math.max(r.required, r.received)), 1);
  const groupW = (w - pad*2) / rows.length;
  const barW = Math.min(26, groupW/3);
  const scaleY = (h - pad - bottomPad);
  return `
    <svg width="100%" viewBox="0 0 ${w} ${h}">
      ${rows.map((r,i) => {
        const gx = pad + i*groupW + groupW/2;
        const reqH = (r.required/max)*scaleY, recH = (r.received/max)*scaleY;
        return `
          <rect x="${gx-barW-3}" y="${h-bottomPad-reqH}" width="${barW}" height="${reqH}" fill="var(--navy-light)" stroke="var(--navy)" stroke-width="1"/>
          <rect x="${gx+3}" y="${h-bottomPad-recH}" width="${barW}" height="${recH}" fill="var(--teal)"/>
          <text x="${gx}" y="${h-bottomPad+16}" font-size="10.5" fill="var(--ink)" text-anchor="middle" font-weight="600">${r.label}</text>
        `;
      }).join('')}
      <line x1="${pad}" y1="${h-bottomPad}" x2="${w-pad}" y2="${h-bottomPad}" stroke="var(--border)" stroke-width="1"/>
    </svg>
    <div style="display:flex; gap:16px; justify-content:center; margin-top:6px; font-size:11.5px;">
      <span><span style="display:inline-block; width:10px; height:10px; background:var(--navy-light); border:1px solid var(--navy); margin-right:5px;"></span>Required</span>
      <span><span style="display:inline-block; width:10px; height:10px; background:var(--teal); margin-right:5px;"></span>Received</span>
    </div>
  `;
}

  CONTRIBUTIONS.forEach(c => {

  const donutSegments = Object.entries(catCounts).length

      <div class="card" style="padding:18px 20px;">

      <p style="font-size:12px; color:var(--muted); margin:0 0 8px;">Physical supply units required vs. delivered, by state (computed live from platform data)</p>

      <div class="card kpi-box"><div class="num">${all.length}</div><div class="lbl">Active disasters</div></div>
      <div class="card kpi-box"><div class="num">${num(supplyAgg.target)}</div><div class="lbl">Total requirements (units)</div></div>

function renderTrackModal() {
  const m = STATE.modal;
  const c = CONTRIBUTIONS.find(x => x.id === m.donationId);
  if (!c) return '';
  const d = DISASTERS[c.disasterId];
  const n = d.needs.find(x => x.id === c.needId);
  const daysElapsed = Math.floor((now - c.date) / (1000*60*60*24));
  const stageDefs = [
    { label: 'Contribution Received', at: 0, note: 'Payment/pledge confirmed and logged to the platform ledger.' },
    { label: 'Verification Completed', at: 1, note: 'Aadhaar/OTP identity check and need-match confirmed by RAHAT.' },
    { label: 'In Logistics', at: 3, note: 'Handed to authorized collection & logistics partner for transport.' },
    { label: 'Distributed', at: 6, note: `Delivered to verified relief camps in ${d.location.split('—')[1] ? d.location.split('—')[1].split(',')[0].trim() : d.location}.` },
  ];
  const reached = stageDefs.filter(s => daysElapsed >= s.at).length;
  const amountLabel = c.type === 'cash' ? inr(c.amount) : `${c.qty} ${n ? n.unit : 'units'}`;
  return `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <div class="modal-head"><h3>Track Contribution</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
        <div class="modal-body">
          <div class="receipt-table" style="margin-top:0;">
            <div><span>Contribution ID</span><span>${c.id}</span></div>
            <div><span>Disaster</span><span>${d.name}</span></div>
            <div><span>Need</span><span>${n ? n.category : '—'}</span></div>
            <div><span>Contribution</span><span>${amountLabel}</span></div>
          </div>
          <div class="trail" style="margin-top:18px; margin-left:4px;">
            ${stageDefs.map((s, i) => {
              const done = i < reached;
              const stageDate = new Date(c.date); stageDate.setDate(stageDate.getDate() + s.at);
              return `
                <div class="trail-item">
                  <div class="t-date">${done ? fmtDate(stageDate) : 'Pending'}</div>
                  <div class="t-body"><strong style="color:${done ? 'var(--success)' : 'var(--faint)'};">${done ? '✓' : '○'} ${s.label}</strong></div>
                  <div class="t-tag" style="${done ? '' : 'opacity:.5;'}">${s.note}</div>
                </div>
              `;
            }).join('')}
          </div>
          ${n ? `<button class="btn btn-outline btn-block" style="margin-top:16px;" onclick="viewImpact('${d.id}','${n.id}')">View allocation trail for this need →</button>` : ''}
        </div>
      </div>
    </div>
  `;
}

function renderContributeModal() {
  const m = STATE.modal;
  const d = DISASTERS[m.disasterId];
  const need = d.needs.find(n => n.id === m.needId);
  const { p } = needProgress(need);
  const isFull = p >= 100;
  const underfunded = d.needs.filter(n => needProgress(n).p < 60 && n.id !== need.id).sort((a,b)=>needProgress(a).p-needProgress(b).p);

  let body = '';
  const stepIndex = m.step;
  const totalSteps = 4;

  if (stepIndex === 0) {
    // Amount / quantity selection, with duplicate-funding nudge
    body = `
      <div class="modal-body">
        ${isFull ? `
          <div class="notice warn">
            <strong>${need.category}</strong> is already fully funded (${p}%). Consider redirecting your support:
            ${underfunded.length ? `<div style="margin-top:8px;">
              ${underfunded.slice(0,2).map(u => `<button class="btn btn-outline btn-sm" style="margin:2px 6px 2px 0;" onclick="switchNeed('${u.id}')">${u.category} (${needProgress(u).p}%)</button>`).join('')}
            </div>` : ''}
          </div>
        ` : ''}
        <div class="field">
          <label>Contributing to</label>
          <select id="need-select" onchange="switchNeed(this.value)">
            ${d.needs.map(n => `<option value="${n.id}" ${n.id===need.id?'selected':''}>${n.category} (${needProgress(n).p}% funded)</option>`).join('')}
          </select>
        </div>
        ${need.type === 'cash' ? `
          <div class="field">
            <label>Amount (₹)</label>
            <div class="chip-row">
              ${[500,1000,2500,5000].map(v => `<button class="chip ${m.amount===v?'selected':''}" onclick="setAmount(${v})">₹${v.toLocaleString('en-IN')}</button>`).join('')}
            </div>
            <input type="number" id="custom-amount" placeholder="Enter custom amount" value="${m.amount && ![500,1000,2500,5000].includes(m.amount) ? m.amount : ''}" oninput="setAmount(parseInt(this.value)||0, true)">
          </div>
        ` : `
          <div class="field">
            <label>Quantity of ${need.unit} to contribute</label>
            <input type="number" id="custom-qty" placeholder="e.g. 10" value="${m.qty || ''}" oninput="setQty(parseInt(this.value)||0)">
          </div>
          <div class="notice info">Physical supplies are routed to the nearest verified drop-off point, or scheduled for courier pickup after verification.</div>
        `}
        <button class="btn btn-primary btn-block" ${((need.type==='cash' && !m.amount) || (need.type==='supply' && !m.qty)) ? 'disabled' : ''} onclick="nextStep()">Continue</button>
      </div>
    `;
  } else if (stepIndex === 1) {
    body = `
      <div class="modal-body">
        <div class="notice info">Aadhaar/OTP verification enables an instant 80G tax receipt and prevents duplicate or fraudulent claims. (Demo: any 6-digit code is accepted.)</div>
        <div class="field"><label>Aadhaar-linked mobile number</label><input type="text" id="mobile" placeholder="98XXX XXXXX" maxlength="10"></div>
        <button class="btn btn-secondary btn-block" onclick="sendOtp()">Send OTP</button>
        ${m.otpSent ? `
          <div class="field" style="margin-top:16px;"><label>Enter OTP</label><input type="text" id="otp" placeholder="6-digit code" maxlength="6"></div>
          <button class="btn btn-primary btn-block" onclick="verifyOtp()">Verify &amp; continue</button>
        ` : ''}
      </div>
    `;
  } else if (stepIndex === 2) {
    const amountLabel = need.type === 'cash' ? inr(m.amount) : `${m.qty} ${need.unit}`;
    body = `
      <div class="modal-body">
        <div class="notice info">Identity verified. ${need.type === 'cash' ? 'Confirm payment via UPI.' : 'Confirm your supply pledge — you will receive nearest drop-off details after this step.'}</div>
        <div class="receipt-table" style="margin-top:0; margin-bottom:16px;">
          <div><span>Disaster</span><span>${d.name}</span></div>
          <div><span>Need</span><span>${need.category}</span></div>
          <div><span>Contribution</span><span>${amountLabel}</span></div>
        </div>
        ${need.type === 'cash' ? `
          <div class="field"><label>UPI ID</label><input type="text" id="upi" placeholder="yourname@upi"></div>
          <button class="btn btn-primary btn-block" onclick="processPayment()" id="pay-btn">Pay ${inr(m.amount)}</button>
        ` : `
          <button class="btn btn-primary btn-block" onclick="processPayment()" id="pay-btn">Confirm supply pledge</button>
        `}
      </div>
    `;
  } else if (stepIndex === 3) {
    const amountLabel = need.type === 'cash' ? inr(m.amount) : `${m.qty} ${need.unit}`;
    body = `
      <div class="modal-body">
        <div class="receipt">
          <div class="checkmark">&#10003;</div>
          <h3 style="margin:0 0 4px;">Contribution successful</h3>
          <p style="color:var(--muted); font-size:13px; margin:0;">Thank you for supporting ${d.name}.</p>
          <div class="receipt-table">
            <div><span>Donation ID</span><span>${m.donationId}</span></div>
            <div><span>Need</span><span>${need.category}</span></div>
            <div><span>Contribution</span><span>${amountLabel}</span></div>
            <div><span>80G Receipt No.</span><span>${m.receiptId}</span></div>
            <div><span>Date</span><span>${fmtDate(now)}</span></div>
          </div>
          <div class="ai-impact-box">
            <div class="ai-impact-label">✨ AI impact summary</div>
            ${m.impactLoading ? `<div class="shimmer-line" style="width:95%;"></div><div class="shimmer-line" style="width:70%;"></div>` : (m.impactSummary || '')}
          </div>
        </div>
        <button class="btn btn-primary btn-block" style="margin-top:18px;" onclick="closeModal()">Done</button>
      </div>
    `;
  }

  return `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <div class="modal-head">
          <h3>${stepIndex === 3 ? 'Receipt' : (need.type === 'cash' ? 'Contribute funds' : 'Donate supplies')}</h3>
          <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        ${stepIndex < 3 ? `<div class="step-dots">${[0,1,2].map(i => `<span class="${i<=stepIndex?'done':''}"></span>`).join('')}</div>` : ''}
        ${body}
      </div>
    </div>
  `;
}

  document.querySelectorAll('[data-countup]').forEach(el => {
    triggerCountUpOnce(el);
  });
}

const countupAnimated = new Set();
function triggerCountUpOnce(el) {
  const target = Number(el.dataset.countup);
  const isCurrency = el.dataset.currency === '1';
  if (!el.id || countupAnimated.has(el.id)) {
    el.textContent = isCurrency ? inr(target) : num(target);
    return;
  }
  countupAnimated.add(el.id);
  animateCountUp(el, target, isCurrency);
}

function localTriageHeuristic(p) {
  const text = (p.category + ' ' + p.description).toLowerCase();
  const highWords = ['outbreak','dengue','infant','baby','no food','medicine','disease','contamina','emergency','critical'];
  const medWords = ['livestock','fodder','sanitation','hygiene','shelter'];
  let urgency = 'Medium';
  if (highWords.some(w => text.includes(w))) urgency = 'High';
  else if (!medWords.some(w => text.includes(w))) urgency = 'Medium';
  else urgency = 'Medium';
  if (text.includes('mosquito') || text.includes('dengue') || text.includes('malaria')) urgency = 'High';
  const duplicate = findPossibleDuplicate(p.category, p.disasterId);
  return {
    category: p.category,
    urgency,
    note: `Based on keyword patterns in the report, this looks like a ${urgency.toLowerCase()}-urgency ${p.district} need. Recommend field confirmation before large-scale allocation.`,
    duplicate: duplicate ? duplicate.category : null,
  };
}

async function analyzeNeedWithAI(pendingId) {
  const p = PENDING_NEEDS.find(x => x.id === pendingId);
  if (!p) return;
  const btn = document.getElementById('analyze-btn-' + pendingId);
  if (btn) { btn.disabled = true; btn.textContent = '✨ Analyzing…'; }

  const d = DISASTERS[p.disasterId];
  const existingCategories = d.needs.map(n => n.category).join(', ');
  const systemPrompt = `You are an AI triage assistant for a district disaster management official reviewing a citizen-submitted need report. Respond in EXACTLY this format and nothing else:\nCategory: <short standardized category name>\nUrgency: <High, Medium, or Low>\nNote: <one concise sentence rationale for the official>`;
  const userPrompt = `Disaster: ${d.name}\nDistrict: ${p.district}\nReported category: ${p.category}\nDescription: ${p.description}\nExisting verified need categories for this disaster: ${existingCategories}`;

  const liveReply = await callAI(systemPrompt, userPrompt);
  let analysis;
  if (liveReply) {
    const catMatch = liveReply.match(/Category:\s*(.+)/i);
    const urgMatch = liveReply.match(/Urgency:\s*(High|Medium|Low)/i);
    const noteMatch = liveReply.match(/Note:\s*(.+)/i);
    if (catMatch && urgMatch && noteMatch) {
      analysis = { category: catMatch[1].trim(), urgency: urgMatch[1].trim(), note: noteMatch[1].trim(), duplicate: (findPossibleDuplicate(p.category, p.disasterId)||{}).category || null };
    }
  }
  if (!analysis) analysis = localTriageHeuristic(p);

  p.aiAnalysis = analysis;
  render();
}

// Agentic command router — keyword-based intent detection (consistent with
// the rest of RAHAT's offline-first design), then a multi-step "plan" the
// user can inspect and approve before anything executes.
async function sendAgentCommand(text) {
  STATE.aiMessages.push({ role: 'user', text });
  render();
  const q = text.toLowerCase();
  const amountMatch = q.match(/₹?\s?(\d[\d,]*)/);

  if (q.includes('triage') || q.includes('pending report')) {
    await runTrace(['🔍 Scanning community-reported needs…', '✨ Running AI/heuristic triage on each report…', '📋 Compiling summary…']);
    const pending = PENDING_NEEDS.filter(p => p.status === 'pending');
    const rows = pending.map(p => { const a = p.aiAnalysis || localTriageHeuristic(p); p.aiAnalysis = a; return { category: p.category, urgency: a.urgency }; });
    STATE.agentPlan = { kind: 'triage', rows };
    STATE.aiMessages.push({ role: 'assistant', text: rows.length ? `Triaged ${rows.length} pending report(s) — see the summary below. Officials can now approve/reject faster in the Official Portal.` : 'No pending community reports to triage right now.' });
    render();
    return;
  }

  if (q.includes('audit') || q.includes('anomal') || q.includes('fraud') || q.includes('risk')) {
    await runTrace(['🔍 Scanning the public funds ledger…', '🧮 Checking disbursement timeliness & UC status…', '🚩 Compiling flags…']);
    const rows = detectFundAnomalies();
    STATE.agentPlan = { kind: 'audit', rows };
    STATE.aiMessages.push({ role: 'assistant', text: rows.length ? `Found ${rows.length} integrity flag(s) across the public funds ledger.` : 'No anomalies found — every fund entry passes timeliness and UC checks right now.' });
    render();
    return;
  }

  if (amountMatch && (q.includes('optim') || q.includes('donat') || q.includes('allocat') || q.includes('split') || q.includes('budget'))) {
    const budget = parseInt(amountMatch[1].replace(/,/g,''), 10);
    if (!budget || budget <= 0) {
      STATE.aiMessages.push({ role: 'assistant', text: "I couldn't parse a budget amount — try something like \"Optimize ₹5000 across underfunded needs\"." });
      render();
      return;
    }
    await runTrace(['🔍 Scanning underfunded needs across all disasters…', '🧮 Ranking by urgency and funding gap…', '📐 Splitting your budget optimally…']);
    const candidates = [];
    Object.values(DISASTERS).forEach(d => d.needs.forEach(n => {
      if (n.type !== 'cash') return;
      const { p } = needProgress(n);
      if (p < 100) candidates.push({ d, n, p, gap: n.target - n.raised });
    }));
    candidates.sort((a,b) => a.p - b.p);
    const top = candidates.slice(0, 3);
    const totalWeight = top.reduce((s,c) => s + (100 - c.p), 0) || 1;
    let remaining = budget;
    const rows = top.map((c, i) => {
      let amount = i === top.length - 1 ? remaining : Math.round(budget * ((100 - c.p) / totalWeight) / 100) * 100;
      amount = Math.min(amount, c.gap, remaining);
      remaining -= amount;
      return { disasterId: c.d.id, needId: c.n.id, needCategory: c.n.category, disasterName: c.d.name, amount };
    }).filter(r => r.amount > 0);
    STATE.agentPlan = { kind: 'budget', budget, rows };
    STATE.aiMessages.push({ role: 'assistant', text: `Here's an optimized split of ${inr(budget)} across the ${rows.length} most underfunded needs I could find. Review below, then execute all at once.` });
    render();
    return;
  }

  // Fall through to the same grounded Q&A the Ask mode uses, so Agent mode
  // never feels like a dead end for a plain question.
  STATE.aiThinking = true;
  render();
  const systemPrompt = `You are the RAHAT Relief Agent. The user is in "agent mode" expecting task execution, but this message didn't match a known agent command (budget optimization, triage, audit). Briefly explain you can optimize a donation budget, triage pending reports, or audit the public funds ledger, and answer their question if possible using this data: ${JSON.stringify(buildDataContext())}`;
  const liveReply = await callAI(systemPrompt, text);
  STATE.aiThinking = false;
  STATE.aiMessages.push({ role: 'assistant', text: liveReply ? escapeHtml(liveReply) : localAssistantReply(text) });
  render();
}

async function executeAgentBudgetPlan() {
  const plan = STATE.agentPlan;
  if (!plan || plan.kind !== 'budget') return;
  for (const r of plan.rows) {
    const d = DISASTERS[r.disasterId];
    const need = d.needs.find(n => n.id === r.needId);
    need.raised += r.amount;
    d.donorCount += 1;
    const donationId = uid('DN');
    const receiptId = '80G/2026/' + uid('X');
    CONTRIBUTIONS.push({ id: donationId, disasterId: d.id, needId: need.id, type: 'cash', amount: r.amount, donor: 'You', date: new Date(now), receipt: receiptId });
    ACTIVITY_FEED.unshift({ text: `You contributed ${inr(r.amount)} to ${need.category} (via AI agent plan)`, disasterId: d.id, time: new Date(now) });
  }
  STATE.aiMessages.push({ role: 'assistant', text: `Done — executed ${plan.rows.length} contribution(s) totaling ${inr(plan.rows.reduce((s,r)=>s+r.amount,0))}. Check "My Contributions" for receipts and tracking.` });
  STATE.agentPlan = null;
  STATE.agentTrace = [];
  fireConfetti();
  render();
}

async function sendAIMessage(text) {
  STATE.aiMessages.push({ role: 'user', text });
  STATE.aiThinking = true;
  render();

  const systemPrompt = `You are the RAHAT Relief Assistant, embedded in a government-verified disaster relief platform. Answer ONLY using the JSON data provided below — never invent figures. Be warm, concise (2-3 sentences max), and end with a concrete next step. Data: ${JSON.stringify(buildDataContext())}`;
  const liveReply = await callAI(systemPrompt, text);
  STATE.aiThinking = false;

  if (liveReply) {
    STATE.aiMessages.push({ role: 'assistant', text: escapeHtml(liveReply) });
  } else {
    STATE.aiMessages.push({ role: 'assistant', text: localAssistantReply(text) });
  }
  render();
}

function processPayment() {

  if (btn) { btn.disabled = true; btn.textContent = 'Processing…'; }
  setTimeout(() => {
    const m = STATE.modal;
    const d = DISASTERS[m.disasterId];
    const need = d.needs.find(n => n.id === m.needId);
    const beforePct = needProgress(need).p;
    if (need.type === 'cash') { need.raised += m.amount; }
    else { need.received += m.qty; }
    const afterPct = needProgress(need).p;
    d.donorCount += 1;

    const donationId = uid('DN');
    const receiptId = '80G/2026/' + uid('X');
    m.donationId = donationId;
    m.receiptId = receiptId;

    CONTRIBUTIONS.push({
      id: donationId, disasterId: d.id, needId: need.id,
      type: need.type, amount: m.amount, qty: m.qty,
      donor: 'You', date: new Date(now), receipt: receiptId
    });
    ACTIVITY_FEED.unshift({
      text: `You contributed ${need.type==='cash' ? inr(m.amount) : m.qty + ' ' + need.unit} to ${need.category}`,
      disasterId: d.id, time: new Date(now)
    });

    m.step = 3;
    m.impactLoading = true;
    render();
    fireConfetti();
    generateImpactSummary(m, d, need, beforePct, afterPct);
  }, 1300);
}

async function generateImpactSummary(m, d, need, beforePct, afterPct) {
  const amountLabel = need.type === 'cash' ? inr(m.amount) : `${m.qty} ${need.unit}`;
  const systemPrompt = `You are writing a single warm, concrete sentence (max 30 words) telling a donor the tangible impact of their contribution, using ONLY the facts given. No exclamation marks, no generic thanks.`;
  const userPrompt = `Disaster: ${d.name} (${d.location}). Need: ${need.category}. Donor contributed: ${amountLabel}. Fulfillment moved from ${beforePct}% to ${afterPct}%.`;
  const liveReply = await callAI(systemPrompt, userPrompt);
  m.impactLoading = false;
  m.impactSummary = liveReply ? escapeHtml(liveReply) : localImpactSummary(d, need, amountLabel, beforePct, afterPct);
  if (STATE.modal === m) render();
}

function localImpactSummary(d, need, amountLabel, beforePct, afterPct) {
  const district = (d.location.split('—')[1] || d.location).split(',')[0].trim();
  return `Your ${amountLabel} moved ${need.category} in ${d.name} from ${beforePct}% to ${afterPct}% funded — real progress toward relief reaching ${district}.`;
}

function fireConfetti() {
  const colors = ['#01A7C2','#FF6B35','#0B3D5C','#34C787','#C9962A'];
  for (let i = 0; i < 40; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random()*100 + 'vw';
    piece.style.background = colors[i % colors.length];
    piece.style.animationDuration = (2 + Math.random()*1.5) + 's';
    piece.style.opacity = String(0.7 + Math.random()*0.3);
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 4000);
  }
}

function animateCountUp(el, target, isCurrency) {
  if (!el) return;
  const duration = 900;
  const start = performance.now();
  function frame(t) {
    const p = Math.min(1, (t - start) / duration);
    const val = Math.round(target * (1 - Math.pow(1-p, 3)));
    el.textContent = isCurrency ? inr(val) : num(val);
    if (p < 1) requestAnimationFrame(frame);
    else el.textContent = isCurrency ? inr(target) : num(target);
  }
  requestAnimationFrame(frame);
}

/* =====================================================================
   ACCESSIBILITY / LITE MODE / LANGUAGE
   ===================================================================== */

function toggleLiteMode() {
  STATE.liteMode = !STATE.liteMode;
  document.body.classList.toggle('lite-mode', STATE.liteMode);
  render();
}
function toggleA11yMode() {
  STATE.a11yMode = !STATE.a11yMode;
  render();
}

/* =====================================================================
   INTER-CAMP RESOURCE REBALANCING
   ===================================================================== */

function suggestRebalance(disasterId, item) {
  const surplus = CAMP_INVENTORY.find(c => c.disasterId===disasterId && c.item===item && c.status==='surplus');
  const deficit = CAMP_INVENTORY.find(c => c.disasterId===disasterId && c.item===item && c.status==='deficit');
  if (!surplus || !deficit) return;
  const moveQty = Math.min(surplus.qty, deficit.qty);
  const d = DISASTERS[disasterId];
  const need = d.needs.find(n => n.category.includes(surplus.matchCategory) || surplus.matchCategory.includes(n.category.split(' (')[0]));
  if (need) {
    need.trail.push({ date: new Date(now), body: `Rebalancing: ${moveQty} ${item} suggested to move from ${surplus.camp} → ${deficit.camp}.`, tag: 'AI Rebalance Suggestion' });
  }
  showToast(`Suggested moving ${moveQty} ${item} from ${surplus.camp} to ${deficit.camp}`);
  render();
}

function adminLogin() {
  const sel = document.getElementById('admin-disaster-select');
  STATE.adminDistrict = sel.value;
  STATE.adminLoggedIn = true;
  render();
}
function adminLogout() {
  STATE.adminLoggedIn = false;
  STATE.adminDistrict = null;
  render();
}
function adminAdjust(needId, dir) {
  const d = DISASTERS[STATE.adminDistrict];
  const n = d.needs.find(x => x.id === needId);
  const step = Math.max(1, Math.round(n.target * 0.05));
  const pledged = n.type === 'cash' ? n.raised : n.received;
  n.delivered = Math.max(0, Math.min(pledged, (n.delivered || 0) + dir * step));
  render();
}
function adminLogUpdate(needId) {
  const d = DISASTERS[STATE.adminDistrict];
  const n = d.needs.find(x => x.id === needId);
  n.trail.push({
    date: new Date(now),
    body: `Field update logged: fulfillment now at ${needProgress(n).p}%.`,
    tag: 'Field update · ' + d.verifiedBy
  });
  showToast('Field update logged to public ledger');
  render();
}

let toastTimer = null;
function showToast(msg) {
  STATE.toast = msg;
  render();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { STATE.toast = null; render(); }, 2600);
}

/* =====================================================================
   INIT
   ===================================================================== */
document.addEventListener('click', function() {
  if (STATE.notifOpen || STATE.settingsOpen) { STATE.notifOpen = false; STATE.settingsOpen = false; render(); }
});
render();
</script>
